version: '3.9'

# ── Hostinger KVM4 / Ollama VPS wiring ────────────────────────────────────────
# For STARTER/PRO plans: point AI_BASE_URL at your Ollama VPS:
#   AI_BASE_URL=http://<kvm4-ip>:11434
# For the HDV-specific Hostinger LLM route, also set:
#   HDV_HOSTINGER_LLM_BASE_URL=http://<kvm4-ip>:11434
#   HDV_HOSTINGER_LLM_API_KEY=<optional — leave blank for Ollama>
# On your KVM4 VPS, expose Ollama on all interfaces:
#   OLLAMA_HOST=0.0.0.0 ollama serve
# Open port 11434 in your Hostinger firewall / UFW rules.
# ──────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-workflow_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-workflow_platform}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production_supersecret}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-production}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-http://localhost:4000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      WORKFLOW_API_KEY: ${WORKFLOW_API_KEY:-hdv-internal-key}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Hostinger KVM4 Ollama VPS — see header comment above
      AI_BASE_URL: ${AI_BASE_URL:-http://localhost:11434}
      AI_API_KEY: ${AI_API_KEY:-ollama}
      AI_MODEL: ${AI_MODEL:-llama3.2}
      HDV_HOSTINGER_LLM_BASE_URL: ${HDV_HOSTINGER_LLM_BASE_URL:-}
      HDV_HOSTINGER_LLM_API_KEY: ${HDV_HOSTINGER_LLM_API_KEY:-}
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: packages/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-workflow_platform}
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      WORKFLOW_API_URL: http://api:4000
      WORKFLOW_API_KEY: ${WORKFLOW_API_KEY:-hdv-internal-key}
      # Hostinger KVM4 Ollama VPS — see header comment above
      AI_BASE_URL: ${AI_BASE_URL:-http://localhost:11434}
      AI_API_KEY: ${AI_API_KEY:-ollama}
      AI_MODEL: ${AI_MODEL:-llama3.2}
      HDV_HOSTINGER_LLM_BASE_URL: ${HDV_HOSTINGER_LLM_BASE_URL:-}
      HDV_HOSTINGER_LLM_API_KEY: ${HDV_HOSTINGER_LLM_API_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      APEX_BASE_URL: ${APEX_BASE_URL:-}
      APEX_API_KEY: ${APEX_API_KEY:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  frontend:
    build:
      context: packages/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000}
      VITE_WS_URL: ${VITE_WS_URL:-http://localhost:4000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ | grep -q '<!DOCTYPE html>' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
