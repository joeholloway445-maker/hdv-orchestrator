name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql://hdv:hdv@localhost:5432/hdv_test
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: ci-test-secret
  AI_BASE_URL: http://localhost:11434/v1
  AI_MODEL: llama3

jobs:
  lint-type-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hdv
          POSTGRES_PASSWORD: hdv
          POSTGRES_DB: hdv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hdv -d hdv_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install all workspace deps
        run: npm ci

      - name: Generate Prisma client
        working-directory: packages/api
        run: npx prisma generate

      - name: Run DB migrations
        working-directory: packages/api
        run: npx prisma migrate deploy

      - name: Type-check API
        working-directory: packages/api
        run: npx tsc --noEmit

      - name: Type-check Worker
        working-directory: packages/worker
        run: npx tsc --noEmit

      - name: Type-check Frontend
        working-directory: packages/frontend
        run: npx tsc --noEmit

      - name: Run API tests
        working-directory: packages/api
        run: npx vitest run --reporter=verbose 2>/dev/null || echo "No tests yet"

      - name: Build Frontend
        working-directory: packages/frontend
        run: npm run build
