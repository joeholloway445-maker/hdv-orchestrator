name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
        continue-on-error: true

      - name: TypeScript check (api)
        run: npx tsc --noEmit
        working-directory: packages/api
        continue-on-error: true

      - name: TypeScript check (worker)
        run: npx tsc --noEmit
        working-directory: packages/worker
        continue-on-error: true

      - name: TypeScript check (frontend)
        run: npx tsc --noEmit
        working-directory: packages/frontend
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f packages/api/Dockerfile -t vision-api .

      - name: Build Worker image
        run: docker build -f packages/worker/Dockerfile -t vision-worker .

      - name: Build Frontend image
        run: docker build -t vision-frontend packages/frontend
